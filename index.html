<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Mobile menu button -->
    <button class="mobile-menu-btn" id="mobileMenuBtn">&#9776;</button>

    <!-- Dark mode toggle -->
    <button class="dark-mode-toggle" id="darkModeToggle" title="Toggle dark mode">&#127769;</button>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>&#128221; My Notes</h1>
                <div class="sidebar-actions">
                    <button class="btn btn-primary btn-small" id="newNoteBtn">+ New</button>
                    <button class="btn btn-secondary btn-small" id="exportAllBtn" title="Export all notes">&#128230; Export</button>
                    <button class="btn btn-secondary btn-small" id="importAllBtn" title="Import notes">&#128229; Import</button>
                    <button class="btn btn-secondary btn-small" id="trashBtn" title="Trash">&#128465;</button>
                </div>
                <div class="sidebar-tabs">
                    <button class="tab-btn active" data-tab="notes">&#128221; Notes</button>
                    <button class="tab-btn" data-tab="books">&#128218; Books</button>
                </div>
                <div class="sidebar-info">
                    <span id="noteCount">0 notes</span>
                    <button class="btn btn-text btn-small" id="sortBtn" title="Sort">&#8597; Sort</button>
                </div>
            </div>
            <div class="search-box tab-search active" id="notesSearch" data-tab="notes">
                <input type="text" id="searchInput" placeholder="&#128269; Search notes...">
            </div>
            <div class="search-box tab-search" id="booksSearch" data-tab="books" style="display:none;">
                <input type="text" id="bookSearchInput" placeholder="&#128269; Search books...">
            </div>
            <div class="note-list tab-content active" id="noteList" data-tab="notes"></div>
            <div class="book-list tab-content" id="bookList" data-tab="books" style="display:none;">
                <div class="book-actions">
                    <button class="btn btn-primary btn-small" id="importBookBtn">&#128218; Import Book</button>
                    <input type="file" id="bookFileInput" accept=".txt,.epub,.pdf,.mobi" style="display:none;" multiple>
                </div>
                <div id="bookItems"></div>
            </div>
        </aside>

        <!-- Resize handle -->
        <div class="resize-handle" id="resizeHandle">
            <div class="resize-handle-bar"></div>
        </div>

        <!-- Editor area -->
        <main class="editor-area" id="editorArea">
            <!-- Empty state -->
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">&#128221;</div>
                <h2>Welcome to Notes App</h2>
                <p>Click "+ New" on the left to create your first note</p>
                <p class="empty-hint">Or drag and drop .txt / .md files here to import</p>
            </div>

            <!-- Note editor -->
            <div class="editor" id="editor" style="display:none;">
                <div class="editor-header">
                    <input type="text" class="title-input" id="titleInput" placeholder="Enter note title...">
                    <div class="editor-meta">
                        <span id="readTime">Read time: 0 min</span>
                        <span id="charCount">Chars: 0</span>
                    </div>
                    <div class="editor-toolbar">
                        <button class="btn btn-text btn-small" id="previewBtn" title="Toggle Markdown preview">&#128065; Preview</button>
                        <button class="btn btn-text btn-small" id="exportBtn">&#128229; Export</button>
                        <button class="btn btn-text btn-small" id="importBtn">&#128228; Import</button>
                        <input type="file" id="fileInput" accept=".txt,.md,.json" style="display:none;">
                        <button class="btn btn-danger btn-small" id="deleteBtn">&#128465; Delete</button>
                    </div>
                </div>
                <div class="editor-body">
                    <textarea id="contentArea" placeholder="Start writing..."></textarea>
                    <div class="markdown-preview" id="markdownPreview" style="display:none;"></div>
                </div>
            </div>

            <!-- Book reader -->
            <div class="book-reader" id="bookReader" style="display:none;">
                <div class="reader-header">
                    <h2 id="bookTitle">Book Title</h2>
                    <div class="reader-controls">
                        <button class="btn btn-text btn-small" id="prevChapterBtn">&#9664; Prev</button>
                        <select id="chapterSelect" class="chapter-select"></select>
                        <button class="btn btn-text btn-small" id="nextChapterBtn">Next &#9654;</button>
                        <button class="btn btn-text btn-small" id="closeBookBtn">&#10005; Close</button>
                    </div>
                </div>
                <div class="reader-body">
                    <div class="reader-content" id="bookContent"></div>
                </div>
                <div class="reader-footer">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span id="progressText">0%</span>
                    <div class="font-controls">
                        <button class="btn btn-text btn-small" id="fontDecrease">A-</button>
                        <button class="btn btn-text btn-small" id="fontIncrease">A+</button>
                        <button class="btn btn-text btn-small" id="toggleReaderTheme">&#127769;</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Trash dialog -->
    <div class="dialog-overlay" id="trashDialog" style="display:none;">
        <div class="dialog">
            <h3>&#128465; Trash</h3>
            <div class="trash-list" id="trashList">
                <p class="trash-empty">Trash is empty</p>
            </div>
            <div class="dialog-actions">
                <button class="btn btn-danger btn-small" id="emptyTrashBtn">Empty Trash</button>
                <button class="btn btn-secondary btn-small" id="closeTrashBtn">Close</button>
            </div>
        </div>
    </div>

    <!-- Import progress overlay -->
    <div class="import-progress-overlay" id="importProgressOverlay" style="display:none;">
        <div class="import-progress">
            <h3>&#128218; 导入中...</h3>
            <p id="importProgressName">正在处理文件</p>
            <div class="progress-bar">
                <div class="progress-fill" id="importProgressFill" style="width: 0%"></div>
            </div>
            <div class="progress-text" id="importProgressText">0%</div>
        </div>
    </div>

    <!-- Confirm dialog -->
    <div class="dialog-overlay" id="confirmDialog" style="display:none;">
        <div class="dialog">
            <h3 id="confirmTitle">Confirm</h3>
            <p id="confirmMessage"></p>
            <div class="dialog-actions">
                <button class="btn btn-danger" id="confirmYes">OK</button>
                <button class="btn btn-secondary" id="confirmNo">Cancel</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
